[project]
name = "day5"
version = "0.1.0"
description = "Extract structured information from resumes with Groq"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pypdf>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
